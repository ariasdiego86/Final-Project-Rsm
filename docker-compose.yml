services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: northwind-db
    environment:
      SA_PASSWORD: ${DB_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: northwind-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database:/database:ro
    networks:
      - app-network
    environment:
      DB_SA_PASSWORD: ${DB_SA_PASSWORD}
    command: >
      bash -c "
        echo 'Running 00-create-database.sql...' &&
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$DB_SA_PASSWORD\" -C -i /database/00-create-database.sql &&
        echo 'Running script-northwindDataBase.sql...' &&
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$DB_SA_PASSWORD\" -C -d Northwind -i /database/script-northwindDataBase.sql &&
        echo 'Running 02-add-geo-columns.sql...' &&
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$DB_SA_PASSWORD\" -C -i /database/02-add-geo-columns.sql &&
        echo 'Database initialization complete.'
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: northwind-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Server=db;Database=${DB_NAME:-Northwind};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      GoogleMaps__ApiKey: ${GOOGLE_MAPS_API_KEY}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_API_BASE_URL: http://localhost:8080
    container_name: northwind-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mssql-data:
